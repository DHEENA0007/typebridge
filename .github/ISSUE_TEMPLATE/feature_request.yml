name: Feature Request
description: Suggest an improvement to TypeBridge IR, parser, or CLI
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the polyglot workflow or schema gap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / API
    validations:
      required: true
