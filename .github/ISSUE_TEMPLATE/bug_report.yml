name: Bug Report
description: Report a parser, generator, or CLI bug in TypeBridge
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: schema
    attributes:
      label: Minimal Schema Reproduction
      description: Paste the TypeScript schema that triggered the issue.
      render: typescript
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target Language / Format
      options:
        - Python (Pydantic / dataclass)
        - Rust (Serde)
        - Go
        - TypeScript / Zod
        - JSON Schema
        - GraphQL
        - OpenAPI
        - MCP
        - Markdown
        - CLI / Parser
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Output
    validations:
      required: true
