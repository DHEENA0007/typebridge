name: New Language / Format Generator
description: Propose or claim a new target generator (great for first-time contributors!)
title: "[Generator]: "
labels: ["good first issue", "generator"]
body:
  - type: markdown
    attributes:
      value: |
        Adding a new generator to TypeBridge is self-contained:
        1. Read `src/ir/types.ts` to see the universal AST (`SchemaDocument`, `TypeDefinition`, `TypeNode`).
        2. Use an existing generator like `src/generators/go.ts` or `src/generators/rust.ts` as a reference.
        3. Register the new target in `src/generators/index.ts`.
        4. Add unit tests in `src/tests/compiler.test.ts`.
  - type: input
    id: language
    attributes:
      label: Target Language or Format
      placeholder: e.g., C#, Java, Protobuf, Valibot, SQL
    validations:
      required: true
  - type: textarea
    id: libraries
    attributes:
      label: Target Idioms / Libraries
      placeholder: e.g., C# System.Text.Json records, Java Jackson records, Protobuf v3 messages
    validations:
      required: true
