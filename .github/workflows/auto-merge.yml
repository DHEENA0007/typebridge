name: Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  automerge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    steps:
      - name: Set Auto-Merge for Pull Request
        run: |
          gh pr merge "${{ github.event.pull_request.html_url }}" --squash --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
