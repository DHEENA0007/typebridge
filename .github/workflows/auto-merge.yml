name: Secure Auto-Merge

on:
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  pull-requests: write
  contents: write

jobs:
  automerge:
    name: Secure Auto-Merge Gate
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'ready-to-merge')
    steps:
      - name: Enable Auto-Merge for Verified PR
        run: |
          gh pr merge "${{ github.event.pull_request.html_url }}" --squash --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
