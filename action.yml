name: 'TypeBridge Schema Sync & Gate'
description: 'Universal schema compiler. Compile or verify synchronization of data models across TypeScript, Python, Rust, Go, and JSON Schema in CI.'
author: 'DHEENA0007'

branding:
  icon: 'shuffle'
  color: 'blue'

inputs:
  command:
    description: 'Command to run: "check" (fails if out of sync) or "generate"'
    required: false
    default: 'check'
  input:
    description: 'Path to source schema file (e.g. types.ts). If omitted, typebridge.config.json is used.'
    required: false
    default: ''
  target:
    description: 'Target language: python, rust, go, typescript, json-schema'
    required: false
    default: ''
  output:
    description: 'Path to target output file'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Run TypeBridge
      shell: bash
      run: |
        if [ -n "${{ inputs.input }}" ] && [ -n "${{ inputs.target }}" ]; then
          if [ -n "${{ inputs.output }}" ]; then
            npx typebridge ${{ inputs.command }} -i "${{ inputs.input }}" -t "${{ inputs.target }}" -o "${{ inputs.output }}"
          else
            npx typebridge ${{ inputs.command }} -i "${{ inputs.input }}" -t "${{ inputs.target }}"
          fi
        else
          npx typebridge ${{ inputs.command }}
        fi
