<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Dark Cyber Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a10" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#bd00ff" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glitch / Hologram Scanlines -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00f3ff" stroke-width="0.7" stroke-opacity="0.08" />
    </pattern>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#172033" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1" fill="#00f3ff" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="900" height="240" rx="12" fill="url(#bgGrad)" />
  <rect width="900" height="240" rx="12" fill="url(#cyberGrid)" />
  <rect width="900" height="240" rx="12" fill="url(#scanlines)" />

  <!-- Outer Technical Border -->
  <rect x="12" y="12" width="876" height="216" rx="8" fill="none" stroke="#1f293d" stroke-width="1.2" />
  
  <!-- Corner Tech Brackets -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#00f3ff" stroke-width="2.5" />
  <path d="M 864 12 L 888 12 L 888 36" fill="none" stroke="#00f3ff" stroke-width="2.5" />
  <path d="M 12 204 L 12 228 L 36 228" fill="none" stroke="#bd00ff" stroke-width="2.5" />
  <path d="M 864 228 L 888 228 L 888 204" fill="none" stroke="#bd00ff" stroke-width="2.5" />

  <!-- Telemetry Watermark & Coordinates -->
  <text x="32" y="32" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" fill="#00f3ff" letter-spacing="2">SYS_ID::TB-AST-902 // PROTOCOL: POLYGLOT_IR</text>
  <text x="750" y="32" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" fill="#00f3ff" letter-spacing="1">● CORE_ONLINE [SYNC: 0.00ms]</text>

  <!-- Circuit Network Lines -->
  <path d="M 40 120 L 120 120 L 160 80 L 260 80" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" />
  <path d="M 640 160 L 740 160 L 780 120 L 860 120" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" />
  <circle cx="160" cy="80" r="3" fill="#00f3ff" />
  <circle cx="260" cy="80" r="2.5" fill="#bd00ff" />
  <circle cx="740" cy="160" r="3" fill="#bd00ff" />
  <circle cx="780" cy="120" r="2.5" fill="#00f3ff" />

  <!-- GLITCH EFFECT TITLE: TypeBridge -->
  <!-- Layer 1: Red/Magenta Glitch Offset -->
  <text x="448" y="118" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="900" fill="#ff0055" fill-opacity="0.8" text-anchor="middle" letter-spacing="6">TYPEBRIDGE</text>
  
  <!-- Layer 2: Cyan Glitch Offset -->
  <text x="452" y="114" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="900" fill="#00f3ff" fill-opacity="0.8" text-anchor="middle" letter-spacing="6">TYPEBRIDGE</text>
  
  <!-- Layer 3: Main Solid White Text -->
  <text x="450" y="116" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">TYPEBRIDGE</text>

  <!-- Horizontal Glitch Slice Bars -->
  <rect x="360" y="88" width="180" height="2" fill="#00f3ff" fill-opacity="0.8" />
  <rect x="410" y="112" width="140" height="1.5" fill="#bd00ff" fill-opacity="0.9" />
  <rect x="330" y="126" width="90" height="2" fill="#00f3ff" fill-opacity="0.7" />

  <!-- Subtitle with Glowing Cyber Tag -->
  <text x="450" y="152" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="600" fill="url(#cyanViolet)" text-anchor="middle" letter-spacing="4">
    UNIVERSAL ZERO-OVERHEAD SCHEMA COMPILER
  </text>

  <!-- Polyglot Matrix Indicator Pills -->
  <g transform="translate(160, 178)">
    <!-- TS Node -->
    <rect x="0" y="0" width="105" height="26" rx="4" fill="#0e1726" stroke="#3178c6" stroke-width="1" />
    <text x="52" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#3178c6" text-anchor="middle">TypeScript</text>

    <!-- Arrow -->
    <text x="120" y="17" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">⇆</text>

    <!-- Python Node -->
    <rect x="135" y="0" width="95" height="26" rx="4" fill="#0e1726" stroke="#3776ab" stroke-width="1" />
    <text x="182" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Python</text>

    <!-- Arrow -->
    <text x="245" y="17" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">⇆</text>

    <!-- Rust Node -->
    <rect x="260" y="0" width="85" height="26" rx="4" fill="#0e1726" stroke="#dea584" stroke-width="1" />
    <text x="302" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#fb923c" text-anchor="middle">Rust</text>

    <!-- Arrow -->
    <text x="360" y="17" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">⇆</text>

    <!-- Go Node -->
    <rect x="375" y="0" width="75" height="26" rx="4" fill="#0e1726" stroke="#00add8" stroke-width="1" />
    <text x="412" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#00add8" text-anchor="middle">Go</text>

    <!-- Arrow -->
    <text x="465" y="17" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">⇆</text>

    <!-- MCP / JSON Schema -->
    <rect x="480" y="0" width="100" height="26" rx="4" fill="#0e1726" stroke="#bd00ff" stroke-width="1" />
    <text x="530" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#e879f9" text-anchor="middle">JSON Schema</text>
  </g>

  <!-- Bottom Telemetry Status -->
  <text x="32" y="222" font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569">ZERO_RUNTIME_OVERHEAD::TRUE</text>
  <text x="868" y="222" font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569" text-anchor="end">SHA::256_AST_VERIFIED</text>
</svg>
